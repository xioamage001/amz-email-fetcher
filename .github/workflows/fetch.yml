name: 亚马逊广告数据每日拉取

on:
  schedule:
    # 北京时间16点到22点，每2小时一次（UTC 8、10、12、14点 = 北京16、18、20、22、23 点）
    - cron: '0 8,9,10,11,12,13,14,15 * * *'

  # 支持手动触发
  workflow_dispatch:

jobs:
  fetch-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      - name: 执行拉取
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node index.js
